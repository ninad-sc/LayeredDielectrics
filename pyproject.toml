[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "layered-dielectrics"
version = "0.1.0"
description = "Transfer matrix based layered dielectric propagation model for reflection coefficient and APD calculation"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Chitnis"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "pandas>=1.3.0",
    "openpyxl>=3.0.7",
]

[project.optional-dependencies]
gui = ["PyQt5>=5.15"]
dev = ["pytest>=7", "build>=1"]

[project.scripts]
layered-dielectrics-summary = "layered_dielectrics.run_phantom_summary:main"
layered-dielectrics-sensitivity = "layered_dielectrics.run_sensitivity:main"
layered-dielectrics-penetration-depth = "layered_dielectrics.calculate_ssl_penetration_depth:main"
layered-dielectrics-export-layers = "layered_dielectrics.export_phantom_layers:cli"
layered-dielectrics-apd = "layered_dielectrics.plot_apd_vs_z:main"
layered-dielectrics-ssl24 = "layered_dielectrics.plot_ssl24_comparison:main"

[project.urls]
Homepage = "https://github.com/ninad-sc/LayeredDielectrics"
Repository = "https://github.com/ninad-sc/LayeredDielectrics.git"
Issues = "https://github.com/ninad-sc/LayeredDielectrics/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["layered_dielectrics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
